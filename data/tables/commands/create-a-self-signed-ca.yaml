columns:
  - Type
  - Operation
  - Command
rows:
  - Type:
      text: Set up the CA
      rowspan: 2
    Operation: Create CA Key
    Command: openssl genrsa -out **ca.key** 4096
  - Operation: Create CA Cert
    Command: |-
      openssl req -x509 -new -nodes -sha512 -days **3650** \
       -subj **"CN=yourdomain.com"** \
       -key **ca.key** \
       -out **ca.crt**
  - Type:
      text: Create the Key and Cert
      rowspan: 6
    Operation: Create Key
    Command: openssl genrsa -out **yourdomain.com.key** 4096
  - Operation: Create CSR
    Command: |-
      openssl req -sha512 -new \
          -subj **"CN=yourdomain.com"** \
          -key **yourdomain.com.key** \
          -out **yourdomain.com.csr**
  - Operation: "Windows: Create Policy File"
    Command: |-
      ; Save this as something like mypolicy.inf using Notepad
      [Version]
      Signature="$Windows NT$"

      [NewRequest]
      ;Change to your,country code, company name and common name
      Subject = "C=US, O=Example Co, CN=something.example.com"

      KeySpec = 1
      KeyLength = 2048
      Exportable = TRUE
      MachineKeySet = TRUE
      SMIME = False
      PrivateKeyArchive = FALSE
      UserProtected = FALSE
      UseExistingKeySet = FALSE
      ProviderName = "Microsoft RSA SChannel Cryptographic Provider"
      ProviderType = 12
      RequestType = PKCS10
      KeyUsage = 0xa0

      [EnhancedKeyUsageExtension]
      OID=1.3.6.1.5.5.7.3.1 ; this is for Server Authentication / Token Signing
  - Operation: "Windows: Create and Sign Request"
    Command: |-
      certreq -new **policyfile.inf myrequest.req**
      certreq -sign **myrequest.req myrequest.req**
  - Operation: "Windows: Accept/Store Cert from CSR"
    Command: certreq -accept **cert.pem**
  - Operation: |-
      Create x509 v3 ext.
      for SANs
    Command: |-
      cat > v3.ext <<-EOF
      authorityKeyIdentifier=keyid,issuer
      basicConstraints=CA:FALSE
      keyUsage = digitalSignature, nonRepudiation, keyEncipherment, dataEncipherment
      extendedKeyUsage = serverAuth
      subjectAltName = @alt_names

      [alt_names]
      DNS.1=**yourdomain.com**
      DNS.2=**yourdomain**
      DNS.3=**hostname**
      EOF
