columns:
  - Type
  - Operation
  - Command
rows:
  - Type:
      text: OCSP
      rowspan: 5
    Operation: Check Status via Serial (Decimal)
    Command: openssl ocsp  -no_nonce -serial **012345** -cert **certificate.pem** -text -url **http://ocsp.my.ca.tld**
  - Operation: Check Status via Serial (Hex)
    Command: openssl ocsp  -no_nonce -serial **0xAF1345** -cert **certificate.pem** -text -url **http://ocsp.my.ca.tld**
  - Operation: Check Status via Certificate
    Command: openssl ocsp  -no_nonce -issuer **chain.pem** -cert **certificate.pem** -text -url **http://ocsp.my.ca.tld**
  - Operation: Save Request and Response
    Command: "# Add '-respout **ocsp.resp** -reqout **ocsp.req**' to save them to the current folder"
  - Operation: Replay with Curl
    Command: 'curl -v -o /dev/null --data-binary @**ocsp.req** -H "Content-Type: application/ocsp-request" --url **http://ocsp.my.ca.tld**'
  - Type: CRL (PEM Nx)
    Operation: List CRL Issuers
    Command: |-
      csplit --prefix='cert.' --suffix-format='%03d.pem' --elide-empty-files **multicert.pem** '/-----BEGIN CERTIFICATE-----/' '{*}'
      find ./cert.*.pem -print0 | xargs -0r -I {} sh -c "printf {}; openssl x509 -in {} -text"
