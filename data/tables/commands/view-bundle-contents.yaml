columns:
  - Type
  - Operation
  - Command
rows:
  - Type: P12
    Operation: List
    Command: |-
      keytool -list -v -keystore **store.p12**  
      # OR
      openssl pkcs12 -info -in **store.p12**
  - Type: JKS
    Operation: List
    Command: keytool -list -v -keystore **store.jks**
  - Type:
      text: PEM
      rowspan: 2
    Operation: List Key
    Command: openssl rsa -in **store.pem** -check
  - Operation: List Cert
    Command: openssl x509 -in **store.pem** -text
  - Type:
      text: PEM(Nx)
      rowspan: 3
    Operation: List Cert Subjects/Issuers
    Command: openssl crl2pkcs7 -nocrl -certfile **CHAINED.pem** | openssl pkcs7 -print_certs -noout
  - Operation: List Cert Details
    Command: openssl crl2pkcs7 -nocrl -certfile **CHAINED.pem** | openssl pkcs7 -print_certs -text -noout
  - Operation: Split Certs
    Command: |-
      csplit --prefix='cert.' --suffix-format='%03d.pem' --elide-empty-files **multicert.pem** '/-----BEGIN CERTIFICATE-----/' '{*}'
      find ./cert.*.pem -print0 | xargs -0r -I {} sh -c "printf {}; openssl x509 -in {} -text"
